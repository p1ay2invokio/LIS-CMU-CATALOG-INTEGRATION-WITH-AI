# ==========================================================
#  LIS CMU Catalog - Setup config
#  Copy this file to "config.ini" and fill in the values.
#  (Only KEY=VALUE lines are read. Lines starting with # are ignored.)
# ==========================================================

# Cloudflare Zero Trust tunnel token
# (Zero Trust Dashboard > Networks > Tunnels > your tunnel > Install connector > copy the long token after "service install")
CLOUDFLARE_TOKEN=

# Google Gemini API key (for AI MARC 21 extraction)
GEMINI_API_KEY=

# Database (XAMPP MySQL on the same machine)
DB_NAME=library
DB_USER=root
# Leave empty to keep XAMPP default (root with no password).
# If set, the installer will set this password for MySQL root on a fresh install.
DB_PASSWORD=

# Port of the backend server (Cloudflare tunnel should point to http://localhost:<SERVER_PORT>)
SERVER_PORT=3001

# Where to install
INSTALL_DIR=C:\LISCatalog
XAMPP_DIR=C:\xampp

# Also install Apache (for OpenBiblio / PHP pages) as a Windows service: yes / no
INSTALL_APACHE=yes
